[project]
name = "llm-gateway"
version = "0.1.0"
description = "One place for the LLM API keys, reachable over REST and gRPC, so no other repo has to hold them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "grpcio>=1.68",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "grpcio-tools>=1.68"]

[project.scripts]
llm-gateway = "gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
